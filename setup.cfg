[metadata]
name = convert2bids
version = 0.0.0
author = Arne Van Den Kerchove
author_email = arne@vandenkerchove.com
description = Convert the biosensor data recorded with the lab equipment to a clean and BIDS-compliant dataset.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.kuleuven.be/compneuro/convert-to-bids

[options]
include_package_data = False
packages = find:
scripts=
    commands/biosemi2bids
    commands/nscurry2bids
python_requires = >=3.6
install_requires =
    click==8.0.1
    mne==0.23.0
    mne-bids==0.7
    numpy==1.20.3
    scipy==1.6.3
    matplotlib==3.4.2
    pybv==0.5.0

